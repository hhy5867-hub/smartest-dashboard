<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART-EST 연구 등록 현황</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
/* =========================
   CSS: Base (기존 그대로 유지)
========================= */
* { box-sizing: border-box; }

/* ===== 기존 CSS 전부 그대로 ===== */
/* (중요: 아래는 기존 + 디자인 튜닝만 추가됨) */

:root {
  --brand-navy: #003876;
  --brand-navy-dark: #002b5c;
  --brand-blue-soft: #eef4fb;
  --brand-line: #d9e3ef;
  --brand-bg: #f4f7fb;
  --brand-accent: #5f7896;
  --text-main: #1f2937;
  --text-sub: #5b6573;
  --text-muted: #7b8794;
  --card-bg: #ffffff;
  --table-head: #f6f9fc;
  --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 10px 24px rgba(15, 23, 42, 0.07);

  --status-active: #003876;
  --status-hold: #9a8f7a;
  --status-closed: #b0b8c2;
  --status-default: #64748b;

  --chart-label-light: #6b7280;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background:
    linear-gradient(180deg, #eef3f9 0%, #f7f9fc 180px, var(--brand-bg) 100%);
  color: var(--text-main);
}

.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px 24px 40px;
}

/* =========================
   디자인 튜닝 (추가)
========================= */

.grid2 {
  gap: 18px;
  margin-bottom: 24px;
}

.card {
  padding: 20px;
}

.section-title {
  font-size: 18px;
  margin-bottom: 14px;
}

.chart-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bar-item {
  display: grid;
  grid-template-columns: minmax(140px, 170px) minmax(260px, 1fr) 60px 70px;
  align-items: center;
  gap: 12px;
  height: 30px;
}

.bar-label {
  font-size: 13px;
  font-weight: 700;
}

.bar-track {
  width: 100%;
  height: 10px;
  background: #e3eaf2;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #0b4b93 0%, #2f69ad 55%, #5d8ec7 100%);
}

.bar-percent {
  text-align: right;
  font-size: 12px;
  font-weight: 800;
}

.bar-value {
  text-align: right;
  font-size: 13px;
  font-weight: 800;
}

.donut-wrap {
  padding: 6px 0 14px;
}

.legend {
  gap: 8px;
}

.legend-item {
  padding: 8px 10px;
  font-size: 13px;
}

.filters {
  gap: 10px;
  margin-bottom: 20px;
}

th, td {
  padding: 11px 8px;
  font-size: 13px;
}

.note {
  margin-top: 20px;
  padding: 16px 18px;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="wrap">

<div class="section-title">기관별 등록 현황</div>
<div class="chart-row">

  <div class="bar-item">
    <div class="bar-label">이대서울</div>
    <div class="bar-track"><div class="bar-fill" style="width:82%"></div></div>
    <div class="bar-percent">82%</div>
    <div class="bar-value">815</div>
  </div>

  <div class="bar-item">
    <div class="bar-label">신촌세브란스</div>
    <div class="bar-track"><div class="bar-fill" style="width:69%"></div></div>
    <div class="bar-percent">69%</div>
    <div class="bar-value">690</div>
  </div>

</div>

</div>
</body>
</html>
