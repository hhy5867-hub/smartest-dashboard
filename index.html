<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART-EST 연구 등록 현황</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
/* 기존 스타일 그대로 유지 */
</style>
</head>
<body>
<div class="wrap">
<!-- 기존 구조 그대로 유지 -->

<script>
/* 기존 코드 유지 + 아래만 수정 */

function parseExcelRows(rows) {
  const firstRow = rows.find(row => Object.keys(row).length > 0);

  const siteIdCol = findColumn(firstRow, ["siteid","기관번호","sitecode"]);
  const siteCol = findColumn(firstRow, ["sitename","기관명","site"]);
  const piCol = findColumn(firstRow, ["sitepi","pi","연구책임자"]);
  const targetCol = findColumn(firstRow, ["targetenr","target"]);
  const consentedCol = findColumn(firstRow, ["consented","동의"]);
  const enrolledCol = findColumn(firstRow, ["enrolled","등록"]);
  const activeCol = findColumn(firstRow, ["ongoing","진행중"]);
  const completedCol = findColumn(firstRow, ["completed","완료"]);
  const droppedCol = findColumn(firstRow, ["dropped","중도탈락"]);
  const queryCol = findColumn(firstRow, ["pendingquery","query"]);
  const updatedCol = findColumn(firstRow, ["lastupdated","최종업데이트"]);

  return rows.map(row => ({
    site_id: siteIdCol ? safeNumber(row[siteIdCol]) : 0,
    site: row[siteCol],
    pi: row[piCol],
    target: safeNumber(row[targetCol]),
    consented: safeNumber(row[consentedCol]),
    enrolled: safeNumber(row[enrolledCol]),
    active: safeNumber(row[activeCol]),
    completed: safeNumber(row[completedCol]),
    dropped: safeNumber(row[droppedCol]),
    pendingQuery: safeNumber(row[queryCol]),
    lastUpdatedDisplay: formatDateValue(row[updatedCol])
  }));
}

/* 🔹 1. 막대 그래프 수정 */
function renderBarChart(rows) {
  barChart.innerHTML = rows.map(row => {
    const percent = row.target ? Math.round((row.enrolled / row.target) * 100) : 0;

    return `
      <div class="bar-item">
        <div class="bar-label">${row.site}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${percent}%">
            <span style="font-size:12px;color:#fff;padding-left:6px;">${percent}%</span>
          </div>
        </div>
        <div style="text-align:right;font-weight:800;">${row.enrolled}</div>
      </div>
    `;
  }).join("");
}

/* 🔹 2. 테이블 수정 */
function renderTable(rows) {

  /* 기관번호 오름차순 정렬 */
  rows.sort((a,b)=>a.site_id - b.site_id);

  tableBody.innerHTML = rows.map(row => `
    <tr>
      <td>${row.site_id}</td>
      <td>${row.site}</td>
      <td>${row.pi}</td>
      <td class="text-right">${row.target}</td>
      <td class="text-right">${row.consented}</td>
      <td class="text-right">${row.enrolled}</td>
      <td class="text-right">${row.active}</td>
      <td class="text-right">${row.completed}</td>
      <td class="text-right">${row.dropped}</td>
      <td class="text-right">${row.pendingQuery}</td>
      <td>${row.lastUpdatedDisplay}</td>
    </tr>
  `).join("");
}

/* 🔹 헤더 수정 */
document.querySelector("thead tr").innerHTML = `
  <th>기관번호</th>
  <th>기관명</th>
  <th>연구책임자</th>
  <th class="text-right">목표</th>
  <th class="text-right">스크리닝(동의 취득)</th>
  <th class="text-right">등록</th>
  <th class="text-right">진행 중</th>
  <th class="text-right">완료</th>
  <th class="text-right">중도탈락</th>
  <th class="text-right">미해결 Query</th>
  <th>최종 업데이트</th>
`;

</script>
</body>
</html>
