<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART-EST 연구 등록 현황</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --brand-navy: #003876;
        --brand-navy-dark: #002b5c;
        --brand-blue-soft: #eef4fb;
        --brand-line: #d9e3ef;
        --brand-bg: #f4f7fb;
        --brand-accent: #5f7896;
        --text-main: #1f2937;
        --text-sub: #5b6573;
        --text-muted: #7b8794;
        --card-bg: #ffffff;
        --table-head: #f6f9fc;
        --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
        --shadow-md: 0 10px 24px rgba(15, 23, 42, 0.07);
      }
      body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; background: linear-gradient(180deg, #eef3f9 0%, #f7f9fc 180px, var(--brand-bg) 100%); color: var(--text-main); }
      .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px 40px; position: relative; }
      .page-update-badge { position: absolute; top: 4px; right: 24px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.88); border: 1px solid #d5e2f0; font-size: 11px; font-weight: 700; }
      .header-shell { background: linear-gradient(135deg,#ffffff 0%,#f8fbff 100%); border: 1px solid var(--brand-line); border-radius: 24px; padding: 24px 26px; margin-top: 18px; margin-bottom: 22px; }
      .header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
      .title-main { margin: 0; font-size: 28px; font-weight: 800; color: var(--brand-navy-dark); }
      .grid5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 16px; margin-bottom: 24px; }
      .card { background: var(--card-bg); border: 1px solid var(--brand-line); border-radius: 20px; padding: 22px; }
      .metric-label { font-size: 13px; color: var(--text-sub); font-weight: 700; }
      .metric-value { font-size: 34px; font-weight: 800; margin-top: 10px; color: var(--brand-navy); }
      .metric-sub { margin-top: 10px; font-size: 13px; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="page-update-badge" id="updateBadge">최종 업데이트: -</div>

      <div class="header-shell">
        <div class="header">
          <h1 class="title-main">SMART-EST 연구 등록 현황</h1>
        </div>
      </div>

      <div class="grid5" id="summaryCards"></div>

    </div>

    <script>
      const sampleData = [
        {
          site: "예시기관",
          target: 0,
          screened: 0,
          consented: 0,
          enrolled: 0,
          active: 0,
          completed: 0,
          dropped: 0,
          pendingQuery: 0,
          siteStatus: "active",
          lastUpdatedDisplay: "2026-04-01"
        }
      ];

      let studyData = [...sampleData];

      const summaryCards = document.getElementById("summaryCards");
      const updateBadge = document.getElementById("updateBadge");

      function getTotals(rows) {
        return rows.reduce((acc, cur) => {
          acc.target += cur.target;
          acc.enrolled += cur.enrolled;
          acc.active += cur.active;
          acc.pendingQuery += cur.pendingQuery;
          acc.siteCount += 1;
          return acc;
        }, {
          target: 0,
          enrolled: 0,
          active: 0,
          pendingQuery: 0,
          siteCount: 0
        });
      }

      function renderSummary(rows, totals) {
        const FIXED_TARGET = 10000;
        const rate = FIXED_TARGET ? Math.round((totals.enrolled / FIXED_TARGET) * 100) : 0;

        const cards = [
          ["참여 기관 수", totals.siteCount, "전체 참여 기관 수"],
          ["총 등록 목표", FIXED_TARGET, "연구 전체 기준 목표 등록 수 (고정값)"],
          ["총 등록 수", totals.enrolled, `목표 대비 ${rate}%`],
          ["진행 중 대상자", totals.active, "현재 follow-up 포함"],
          ["미해결 Query", totals.pendingQuery, "기관 확인 필요 건수"]
        ];

        summaryCards.innerHTML = cards.map(card => `
          <div class="card">
            <div class="metric-label">${card[0]}</div>
            <div class="metric-value">${Number(card[1]).toLocaleString()}</div>
            <div class="metric-sub">${card[2]}</div>
          </div>
        `).join("");
      }

      function updateLastUpdatedBadge(rows) {
        const latest = rows.length ? rows[0].lastUpdatedDisplay : "-";
        updateBadge.textContent = `최종 업데이트: ${latest}`;
      }

      function renderAll() {
        const totals = getTotals(studyData);
        renderSummary(studyData, totals);
        updateLastUpdatedBadge(studyData);
      }

      renderAll();
    </script>
  </body>
</html>
