<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SMART-EST 연구 등록 현황</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
/* 기존 스타일 유지 + 추가 */
.bar-track{position:relative;}
.bar-text{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:12px;
font-weight:700;
color:#fff;
pointer-events:none;
}
</style>
</head>

<body>

<input type="file" id="fileInput">

<div id="barChart"></div>

<table border="1">
<thead>
<tr>
<th>기관번호</th>
<th>기관명</th>
<th>연구책임자</th>
<th>목표</th>
<th>스크리닝</th>
<th>등록</th>
<th>진행 중</th>
<th>완료</th>
<th>중도탈락</th>
<th>미해결 Query</th>
<th>최종 업데이트</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>

let studyData=[];

function renderBarChart(rows){
document.getElementById("barChart").innerHTML = rows.map(row=>{
const percent = row.target>0 ? Math.round((row.enrolled/row.target)*100) : 0;

return `
<div style="margin-bottom:12px;">
<div>${row.site}</div>
<div class="bar-track" style="height:20px;background:#eee;border-radius:10px;">
<div style="width:${percent}%;height:100%;background:#003876;border-radius:10px;position:relative;">
<span class="bar-text">${percent}%</span>
</div>
</div>
<div style="text-align:right;font-weight:700;">${row.enrolled}</div>
</div>
`;
}).join("");
}

function renderTable(rows){
document.getElementById("tableBody").innerHTML = rows.map(row=>`
<tr>
<td>${row.site_id || "-"}</td>
<td>${row.site}</td>
<td>${row.pi || "-"}</td>
<td>${row.target}</td>
<td>${row.screened}</td>
<td>${row.enrolled}</td>
<td>${row.active}</td>
<td>${row.completed}</td>
<td>${row.dropped}</td>
<td>${row.pendingQuery}</td>
<td>${row.lastUpdated}</td>
</tr>
`).join("");
}

function renderAll(){
const sorted = [...studyData].sort((a,b)=>{
if(!a.site_id) return 1;
if(!b.site_id) return -1;
return a.site_id > b.site_id ? 1 : -1;
});
renderBarChart(sorted);
renderTable(sorted);
}

function parseExcel(rows){
return rows.map(r=>({
site: r.site_name,
site_id: r.site_id,
pi: r.site_pi,
target: Number(r.target_enr)||0,
screened: Number(r.consented)||0,
enrolled: Number(r.enrolled)||0,
active: Number(r.ongoing)||0,
completed: Number(r.completed)||0,
dropped: Number(r.dropped)||0,
pendingQuery: Number(r.pending_query)||0,
lastUpdated: r.last_updated
}));
}

document.getElementById("fileInput").addEventListener("change",function(e){
const file = e.target.files[0];
const reader = new FileReader();

reader.onload = function(e){
const data = new Uint8Array(e.target.result);
const wb = XLSX.read(data,{type:"array"});
const ws = wb.Sheets[wb.SheetNames[0]];
const rows = XLSX.utils.sheet_to_json(ws,{defval:""});
studyData = parseExcel(rows);
renderAll();
};

reader.readAsArrayBuffer(file);
});

</script>

</body>
</html>
