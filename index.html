<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART-EST 연구 등록 현황</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
* { box-sizing: border-box; }

:root {
  --brand-navy: #003876;
  --brand-line: #d9e3ef;
  --brand-bg: #f4f7fb;
  --text-main: #1f2937;
  --text-sub: #5b6573;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: var(--brand-bg);
  color: var(--text-main);
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

.card {
  background: #fff;
  border: 1px solid var(--brand-line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.section-title {
  font-weight: 800;
  margin-bottom: 12px;
}

.chart-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bar-item {
  display: grid;
  grid-template-columns: 140px 1fr 160px;
  gap: 10px;
  align-items: center;
}

.bar-track {
  height: 12px;
  background: #e5ebf3;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: #003876;
  border-radius: 999px;
  position: relative;
}

.bar-inside-label {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
}

.bar-value {
  font-weight: 700;
  text-align: right;
}

.bar-value span {
  opacity: 0.4;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border: 1px solid #d1d9e6;
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #eee;
}

th {
  cursor: pointer;
  background: #f6f9fc;
}

.sort-indicator {
  margin-left: 4px;
  font-size: 10px;
}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <div class="section-title">기관별 등록 현황</div>
  <div class="chart-row" id="chart"></div>
</div>

<div class="card">
  <input type="text" id="search" placeholder="기관명 또는 연구자 검색">
  <table>
    <thead>
      <tr>
        <th data-key="site_id">기관번호<span class="sort-indicator"></span></th>
        <th data-key="site">기관명<span class="sort-indicator"></span></th>
        <th data-key="pi">연구책임자<span class="sort-indicator"></span></th>
        <th data-key="target">목표<span class="sort-indicator"></span></th>
        <th data-key="enrolled">등록<span class="sort-indicator"></span></th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

</div>

<script>
let data = [
  {site_id:2001, site:"세브란스", pi:"김", target:50, enrolled:30}
];

let sort = {key:"site_id", dir:"asc"};

function render() {
  const keyword = document.getElementById("search").value.toLowerCase();

  let rows = data.filter(d =>
    d.site.toLowerCase().includes(keyword) ||
    d.pi.toLowerCase().includes(keyword)
  );

  rows.sort((a,b)=>{
    let v = a[sort.key] > b[sort.key] ? 1 : -1;
    return sort.dir==="asc" ? v : -v;
  });

  renderChart(rows);
  renderTable(rows);
  updateSortUI();
}

function renderChart(rows){
  const max = Math.max(...rows.map(r => r.enrolled), 1);

  document.getElementById("chart").innerHTML = rows.map(r => {
    const w = (r.enrolled / max) * 100;
    const percent = r.target ? Math.round((r.enrolled / r.target) * 100) : 0;
    const visualWidth = r.enrolled > 0 ? Math.max(w, 18) : 0;

    return `
      <div class="bar-item">
        <div>${r.site}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${visualWidth}%">
            ${r.enrolled > 0 ? `<span class="bar-inside-label">${percent}%</span>` : ``}
          </div>
        </div>
        <div class="bar-value">
          ${r.enrolled}&nbsp;&nbsp;I&nbsp; <span>${r.target}</span>
        </div>
      </div>
    `;
  }).join("");
}

function renderTable(rows){
  document.getElementById("table").innerHTML = rows.map(r => `
    <tr>
      <td>${r.site_id}</td>
      <td>${r.site}</td>
      <td>${r.pi}</td>
      <td>${r.target}</td>
      <td>${r.enrolled}</td>
    </tr>
  `).join("");
}

function updateSortUI(){
  document.querySelectorAll("th").forEach(th => {
    const key = th.dataset.key;
    const el = th.querySelector(".sort-indicator");
    if(sort.key === key){
      el.textContent = sort.dir === "asc" ? "▲" : "▼";
    } else {
      el.textContent = "";
    }
  });
}

document.getElementById("search").addEventListener("input", render);

document.querySelectorAll("th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if(sort.key === key){
      sort.dir = sort.dir === "asc" ? "desc" : "asc";
    } else {
      sort.key = key;
      sort.dir = "asc";
    }
    render();
  });
});

render();
</script>
</body>
</html>
