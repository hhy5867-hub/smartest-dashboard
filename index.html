<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART-EST 연구 등록현황</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
<script>
const SUPABASE_URL = "https://coylnollejkngrnreijt.supabase.co";
const SUPABASE_KEY = "sb_publishable_XDxYpO-G0UXjdyyknjgCoA_siyjCHlP";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  rawRows: [],
  rows: [],
  filteredRows: [],
  totalTargetFixed: 10000,
  lastSync: null
};

function numberOrZero(v) {
  if (v === null || v === undefined || v === "") return 0;
  const n = Number(String(v).replace(/,/g, "").trim());
  return Number.isFinite(n) ? n : 0;
}

function safeText(v) {
  return (v ?? "").toString().trim();
}

function normalizeDate(v) {
  if (!v) return "-";
  const d = new Date(v);
  if (!isNaN(d.getTime())) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }
  return "-";
}

function normalizeDbRow(raw) {
  return {
    site: safeText(raw.site_name),
    pi: safeText(raw.site_pi || "-"),
    target: numberOrZero(raw.target_enrollment),
    screened: 0,
    consented: numberOrZero(raw.consented),
    enrolled: numberOrZero(raw.enrolled),
    active: raw.site_active === "active" ? numberOrZero(raw.enrolled) : 0,
    completed: numberOrZero(raw.completed),
    dropped: numberOrZero(raw.dropped),
    pending_query: numberOrZero(raw.pening_query),
    last_updated: normalizeDate(raw.last_updated),
    display_order: numberOrZero(raw.display_order)
  };
}

function mergeSites(rows) {
  const map = new Map();

  rows.forEach(row => {
    if (!row.site) return;

    if (!map.has(row.site)) {
      map.set(row.site, { ...row });
    } else {
      const item = map.get(row.site);
      item.target += row.target;
      item.consented += row.consented;
      item.enrolled += row.enrolled;
      item.active += row.active;
      item.completed += row.completed;
      item.dropped += row.dropped;
      item.pending_query += row.pending_query;
    }
  });

  return Array.from(map.values());
}

async function loadSites() {
  const { data, error } = await supabase
    .from("study_sites")
    .select(`
      site_name,
      site_pi,
      target_enrollment,
      consented,
      enrolled,
      completed,
      dropped,
      pening_query,
      last_updated,
      display_order,
      site_active
    `)
    .order("display_order", { ascending: true });

  if (error) {
    alert(error.message);
    return;
  }

  const normalized = (data || []).map(normalizeDbRow);
  state.rawRows = normalized;
  state.rows = mergeSites(normalized);
  state.lastSync = new Date().toLocaleString("ko-KR");

  console.log(state.rows);
}

async function deleteAllStudySites() {
  const { error } = await supabase
    .from("study_sites")
    .delete()
    .not("site_id", "is", null);

  if (error) throw error;
}

async function insertStudySitesInBatches(rows, batchSize = 500) {
  for (let i = 0; i < rows.length; i += batchSize) {
    const batch = rows.slice(i, i + batchSize);
    const { error } = await supabase
      .from("study_sites")
      .insert(batch);

    if (error) throw error;
  }
}

function normalizeExcelRow(raw, index) {
  return {
    site_name: raw.site,
    site_pi: raw.pi,
    target_enrollment: numberOrZero(raw.target),
    consented: numberOrZero(raw.consented),
    enrolled: numberOrZero(raw.enrolled),
    completed: numberOrZero(raw.completed),
    dropped: numberOrZero(raw.dropped),
    pening_query: numberOrZero(raw.pending_query),
    last_updated: normalizeDate(raw.last_updated),
    display_order: index + 1,
    site_active: raw.active > 0 ? "active" : "inactive"
  };
}

function readExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        resolve(json);
      } catch (err) {
        reject(err);
      }
    };

    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

async function uploadExcelToSupabase(file) {
  try {
    const rawRows = await readExcelFile(file);

    const normalizedRows = rawRows
      .map((row, index) => normalizeExcelRow(row, index))
      .filter(row => row.site_name);

    await deleteAllStudySites();
    await insertStudySitesInBatches(normalizedRows, 500);

    await loadSites();
  } catch (error) {
    alert(error.message);
  }
}

loadSites();
</script>
</body>
</html>
