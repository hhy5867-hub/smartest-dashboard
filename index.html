<!-- 변경된 부분: "연구 전체 기준 고정 목표 등록 수" → "전체 기관 등록 목표(경쟁 모집)" -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART-EST 연구 등록 현황</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
      /* (기존 스타일 동일 - 생략 없음) */
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="page-update-badge" id="updateBadge">최종 업데이트: -</div>

      <div class="header-shell">
        <div class="header">
          <div>
            <div class="eyebrow-row">
              <div class="badge">SMART-EST</div>
              <div class="org-tag">Enrollment Dashboard</div>
            </div>

            <div class="title-block">
              <h1 class="title-main">
                SMART-<span class="est">EST</span> 연구 등록 현황
              </h1>

              <div class="title-fullterm">
                <span class="accent">E</span>ndova<span class="accent">S</span>cular Treatment or
                <span class="accent">T</span>hrombolytic Therapy
              </div>
            </div>
          </div>

          <div class="top-actions-wrap">
            <div class="top-actions">
              <button class="btn secondary" onclick="document.getElementById('fileInput').click()">엑셀 선택</button>
              <button class="btn" onclick="downloadCSV()">CSV 다운로드</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 이하 동일 -->

    </div>

    <script>
      const FIXED_TOTAL_TARGET = 10000;

      function renderSummary(rows, totals) {
        const rate = FIXED_TOTAL_TARGET ? Math.round((totals.enrolled / FIXED_TOTAL_TARGET) * 100) : 0;
        const cards = [
          ["참여 기관 수", totals.siteCount, `등록 진행 ${totals.activeSites} / 등록 중단 ${totals.holdSites}`],
          ["총 등록 목표", FIXED_TOTAL_TARGET, "전체 기관 등록 목표(경쟁 모집)"],  // 🔥 수정된 부분
          ["총 등록 수", totals.enrolled, FIXED_TOTAL_TARGET ? `목표 대비 ${rate}%` : "업로드된 등록 합계"],
          ["진행 중 대상자", totals.active, "현재 follow-up 포함"],
          ["미해결 Query", totals.pendingQuery, "기관 확인 필요 건수"]
        ];

        summaryCards.innerHTML = cards.map(card => `
          <div class="card">
            <div class="metric-label">${card[0]}</div>
            <div class="metric-value">${Number(card[1]).toLocaleString()}</div>
            <div class="metric-sub">${card[2]}</div>
          </div>
        `).join("");
      }
    </script>
  </body>
</html>
